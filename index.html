<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the page use the iPhone's safe-area insets (see index.css and StickyResult). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The site has one light design; this stops browsers from force-darkening it or its form controls. -->
    <meta name="color-scheme" content="light" />
    <!--
      Page-specific tags (description, canonical, robots, Open Graph, Twitter,
      structured data) are set per page with react-helmet-async and baked into
      each page's HTML by scripts/prerender.cjs. Don't add them here: a second
      copy in this shell ends up duplicated on every page.
    -->
    <title>MortgageCalculation.net</title>
    <meta name="theme-color" content="#1e3a5f" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link rel="apple-touch-icon-precomposed" href="/favicon.png" />
    <meta name="msapplication-TileImage" content="/favicon.png" />


    <!-- Skip link styles (inline for immediate availability) -->
    <style>
      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #1e3a5f;
        color: white;
        padding: 8px 16px;
        z-index: 100;
        text-decoration: none;
        font-family: sans-serif;
        border-radius: 0 0 8px 0;
      }
      .skip-link:focus {
        top: 0;
      }
    </style>
  </head>

  <body>
    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div id="root"></div>
    <script>
      // SPA redirect support (pairs with public/404.html)
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get("p");
        if (!p) return;
        var q = params.get("q");
        var h = params.get("h");
        // Construct the proper path
        var newPath = p + (q ? "?" + q : "") + (h ? "#" + h : "");
        window.history.replaceState(null, "", newPath);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
