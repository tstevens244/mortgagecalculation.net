name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Freddie Mac publishes its weekly rate survey on Thursdays at noon ET (Wednesdays
  # in holiday weeks). Rebuild afterwards so "today's average rate" stays current; the
  # same run picks up Zillow's monthly home values and moves the "Figures updated" date.
  schedule:
    - cron: "30 18 * * 3,4"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the sitemap's <lastmod> dates come from real commits.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Install Chrome for Puppeteer
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      - name: Fetch this week's average mortgage rates and home values
        run: npm run rates

      - name: Build
        run: npm run build

      - name: Prerender static HTML
        run: node scripts/prerender.cjs
        env:
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Generate sitemap
        run: node scripts/generate-sitemap.cjs

      - name: Check SEO tags on every page
        run: node scripts/check-seo.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify Search Engines via IndexNow
        # Not on the weekly rate refresh: only the rate figures change, not the pages.
        if: github.event_name != 'schedule'
        # Submits every URL in the freshly deployed sitemap, so new pages are
        # included without editing the Supabase function's built-in list.
        run: |
          urls=$(curl -s "https://mortgagecalculation.net/sitemap.xml?deploy=${{ github.run_id }}" \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc '{urls: .}')
          if [ "$(echo "$urls" | jq '.urls | length')" -eq 0 ]; then urls='{}'; fi
          curl -X POST "https://dvohmhmnfsuuicodnaod.supabase.co/functions/v1/indexnow" \
            -H "Content-Type: application/json" \
            -d "$urls" || true
